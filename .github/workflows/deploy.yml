name: Build i deploy na GitHub Pages

# Build-uje web verziju igre i objavljuje je na GitHub Pages.
# Pokrece se na svaki push u main, ili rucno iz Actions taba.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ako pushujes dva puta brzo, prekini stari build.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skini Godot i export template
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          # Template mora da bude u ~/.local/share/godot/export_templates/<verzija>.stable
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Uvezi projekat
        # Prvi prolaz generise .godot/ (uvoz assetа). Godot vrati non-zero
        # kod pri --import cak i kad uspe, pa `|| true`.
        run: godot --headless --import || true

      - name: Build web verzije
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web/

      - name: Provera da build nije prazan
        run: |
          test -f build/web/index.html || { echo "NEMA index.html"; exit 1; }
          test -f build/web/index.wasm || { echo "NEMA index.wasm"; exit 1; }
          test -f build/web/index.pck  || { echo "NEMA index.pck";  exit 1; }
          echo "Build OK: $(du -sh build/web | cut -f1)"

      # Otisak ove verzije. Shell ga cita sa `cache: no-store` i, ako se
      # razlikuje od zapamcenog, brise kes i reloaduje. Bez ovoga zaglavljen
      # service worker servira stari index.pck i posle uspesnog deploya -
      # izgleda kao da novi nivoi ne postoje.
      - name: Upisi verziju za proveru kesa
        run: |
          git rev-parse --short HEAD > build/web/version.txt
          echo "verzija: $(cat build/web/version.txt)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 600000ms (10 min) je HARD MAKSIMUM akcije, ne samo podrazumevana
      # vrednost. Probao sam 1800000 i akcija je uzvratila:
      #   "timeout value is greater than the allowed maximum
      #    - timeout set to the maximum of 600000 milliseconds"
      # pa je korak i dalje pao na 605s. Timeout se NE MOZE podici.
      #
      # Mereno 2026-08-06: uspesni deploy je trajao 547s (53s od ruba),
      # a posle toga Pages stoji u "in_progress" duze od 10 min i akcija
      # ga otkaze. Build, export i artifact prolaze svaki put (13.51 MB
      # vs 13.49 MB kod uspesnog) - pada samo cekanje na Pages.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 20
