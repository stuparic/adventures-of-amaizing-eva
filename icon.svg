<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Ljubicasta tinta: dublja u dnu, svetlija gore -->
    <radialGradient id="ink" cx="42%" cy="30%" r="88%">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="52%"  stop-color="#6d33d9"/>
      <stop offset="100%" stop-color="#3d1470"/>
    </radialGradient>

    <linearGradient id="hair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#ffe89a"/>
      <stop offset="55%"  stop-color="#f7cf5f"/>
      <stop offset="100%" stop-color="#e0ab34"/>
    </linearGradient>

    <linearGradient id="skin" x1="30%" y1="10%" x2="70%" y2="95%">
      <stop offset="0%"   stop-color="#ffeadd"/>
      <stop offset="100%" stop-color="#f5cfb6"/>
    </linearGradient>

    <linearGradient id="dress" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%"   stop-color="#7ee0a0"/>
      <stop offset="100%" stop-color="#3da86a"/>
    </linearGradient>

    <linearGradient id="star" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Mek sjaj oko lika, da se odvoji od tinte -->
    <radialGradient id="halo" cx="50%" cy="52%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Podloga -->
  <rect width="512" height="512" rx="116" fill="url(#ink)"/>

  <!-- Suptilni prsten, daje dubinu ivici -->
  <rect x="14" y="14" width="484" height="484" rx="104"
        fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="5"/>

  <!-- Zvezdice u pozadini -->
  <g fill="#ffffff">
    <circle cx="96"  cy="118" r="7"   opacity=".85"/>
    <circle cx="418" cy="150" r="5.5" opacity=".7"/>
    <circle cx="140" cy="368" r="5"   opacity=".55"/>
    <circle cx="392" cy="392" r="6.5" opacity=".6"/>
    <circle cx="64"  cy="250" r="4"   opacity=".45"/>
    <circle cx="454" cy="286" r="4"   opacity=".4"/>
  </g>

  <!-- Velika zvezdica gore desno (skupljanje = srz igre) -->
  <path d="M388 118 l12 25 27.5 3.8 -20 19.2 5 27.3 -24.5-13.2 -24.5 13.2 5-27.3 -20-19.2 27.5-3.8z"
        fill="url(#star)" opacity=".95"/>

  <circle cx="256" cy="268" r="176" fill="url(#halo)"/>

  <!-- ===== Eva ===== -->
  <g transform="translate(256 250) scale(0.82) translate(-256 -250)">
    <!-- Kosa iza tela: duga, do pojasa -->
    <path d="M256 96
             c-64 0 -104 42 -104 96
             c0 26 4 52 4 82
             c0 44 -6 78 -6 104
             l40 8
             c2 -34 6 -72 6 -108
             c0 -26 -4 -46 -4 -66
             c0 -34 26 -58 64 -58
             c38 0 64 24 64 58
             c0 20 -4 40 -4 66
             c0 36 4 74 6 108
             l40 -8
             c0 -26 -6 -60 -6 -104
             c0 -30 4 -56 4 -82
             c0 -54 -40 -96 -104 -96z"
          fill="url(#hair)"/>

    <!-- Haljina -->
    <path d="M256 300
             c-34 0 -58 10 -58 10
             l-30 116
             c0 12 40 22 88 22
             s88 -10 88 -22
             l-30 -116
             s-24 -10 -58 -10z"
          fill="url(#dress)"/>
    <!-- Karner na haljini -->
    <path d="M170 408 c26 12 54 16 86 16 s60 -4 86 -16 l6 22 c-28 13 -58 18 -92 18 s-64 -5 -92 -18z"
          fill="#ffffff" opacity=".55"/>

    <!-- Ruke -->
    <path d="M198 312 c-16 8 -26 30 -28 56 l30 8 c2 -22 8 -40 18 -50z" fill="url(#skin)"/>
    <path d="M314 312 c16 8 26 30 28 56 l-30 8 c-2 -22 -8 -40 -18 -50z" fill="url(#skin)"/>

    <!-- Vrat -->
    <path d="M238 264 h36 v34 h-36z" fill="#f0c3a8"/>

    <!-- Lice -->
    <path d="M256 128
             c-42 0 -70 30 -70 74
             c0 46 30 84 70 84
             s70 -38 70 -84
             c0 -44 -28 -74 -70 -74z"
          fill="url(#skin)"/>

    <!-- Siske -->
    <path d="M256 122
             c-46 0 -74 30 -76 72
             c14 -6 22 -22 30 -22
             c10 0 14 14 24 14
             c10 0 14 -16 24 -16
             s16 16 26 16
             c10 0 14 -14 24 -14
             c8 0 16 16 28 22
             c-2 -42 -34 -72 -80 -72z"
          fill="url(#hair)"/>

    <!-- Oci -->
    <ellipse cx="224" cy="202" rx="16" ry="18" fill="#ffffff"/>
    <ellipse cx="288" cy="202" rx="16" ry="18" fill="#ffffff"/>
    <circle cx="226" cy="204" r="11" fill="#3b82f6"/>
    <circle cx="290" cy="204" r="11" fill="#3b82f6"/>
    <circle cx="226" cy="204" r="5.5" fill="#152449"/>
    <circle cx="290" cy="204" r="5.5" fill="#152449"/>
    <circle cx="221" cy="197" r="4" fill="#ffffff"/>
    <circle cx="285" cy="197" r="4" fill="#ffffff"/>

    <!-- Osmeh -->
    <path d="M232 240 q24 22 48 0 q-24 34 -48 0z" fill="#c2566a"/>

    <!-- Masna u kosi -->
    <g>
      <path d="M186 140 q-30 -20 -46 -4 q-4 20 14 26 q18 6 32 -6z" fill="#f472b6"/>
      <path d="M186 140 q-20 24 -2 38 q20 8 28 -10 q6 -18 -12 -28z" fill="#ec4899"/>
      <circle cx="188" cy="148" r="9" fill="#be2f72"/>
    </g>
  </g>
</svg>
