<!DOCTYPE html>
<html lang="sr">
<head>
	<meta charset="utf-8">
	<!-- viewport-fit=cover: canvas ide i pod "notch" na iPhone-u -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#87ceeb">
	<title>$GODOT_PROJECT_NAME</title>
	<link rel="icon" href="$GODOT_PROJECT_ICON">
	<link rel="apple-touch-icon" href="$GODOT_APPLE_TOUCH_ICON">
	<!-- Manifest: bez njega "dodaj na pocetni ekran" ne daje fullscreen.
	     Godot ga ubacuje samo u svoj default shell, custom mora sam. -->
	<link rel="manifest" href="index.manifest.json">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			/* Boja neba iz igre - ako se negde vidi ivica, stopi se sa igrom
			   umesto da bude crna pruga. */
			background: #87ceeb;
			touch-action: none;
			-webkit-tap-highlight-color: transparent;
			-webkit-user-select: none;
			user-select: none;
			overscroll-behavior: none;
		}

		/* Canvas popunjava CEO ekran - bez crnih pruga i bez okvira. */
		#canvas {
			display: block;
			border: 0;
			outline: none;
			/* KLJUCNO: bez ovoga browser preuzima skrol/pinch na canvasu
			   pre Godota, pa zumiranje u igri ne radi. body{touch-action}
			   se NE nasledjuje na canvas - mora eksplicitno. */
			touch-action: none;
			-ms-touch-action: none;
		}
		#canvas:focus { outline: none; }

		/* --- Ucitavanje --- */
		#boot {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 22px;
			background: #87ceeb;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
			color: #2c4a6e;
			z-index: 10;
			transition: opacity .4s ease;
		}
		#boot.done { opacity: 0; pointer-events: none; }

		#boot h1 {
			font-size: clamp(22px, 6vw, 40px);
			font-weight: 800;
			text-align: center;
			padding: 0 18px;
			text-shadow: 0 2px 0 rgba(255, 255, 255, .65);
		}

		#bar {
			width: min(74vw, 340px);
			height: 16px;
			border: 3px solid #fff;
			border-radius: 10px;
			overflow: hidden;
			background: rgba(255, 255, 255, .3);
		}
		#fill {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #ffd93d, #ff9f43);
			transition: width .2s ease;
		}

		#boot p { font-size: clamp(13px, 3.4vw, 16px); opacity: .85; }

		/* --- Kontrole mape (HTML, ne Godot UI) ---
		   Rade preko window.evaZoomIn/Out/Home koje registruje world_map.gd.
		   Ne zavise od Godotovog input sistema, koji na webu nije pouzdan
		   za skrol i pinch. --- */
		#mapctl {
			position: fixed;
			right: 12px;
			top: 50%;
			transform: translateY(-50%);
			display: none;
			flex-direction: column;
			gap: 9px;
			z-index: 14;
		}
		#mapctl.show { display: flex; }
		#mapctl button {
			width: 54px;
			height: 54px;
			border: 3px solid rgba(255, 255, 255, .9);
			border-radius: 15px;
			background: rgba(30, 55, 85, .82);
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
			font-size: 24px;
			font-weight: 700;
			cursor: pointer;
			-webkit-tap-highlight-color: transparent;
			box-shadow: 0 3px 10px rgba(0, 0, 0, .28);
		}
		#mapctl button:active {
			background: rgba(60, 100, 150, .95);
			transform: scale(.94);
		}
		#mz-home { font-size: 15px !important; }

		/* --- "Dodaj na pocetni ekran" (samo u browseru na telefonu) --- */
		#install {
			position: fixed;
			left: 8px;
			right: 8px;
			bottom: 8px;
			display: none;
			align-items: center;
			gap: 10px;
			padding: 11px 13px;
			border-radius: 12px;
			background: rgba(20, 40, 65, .9);
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
			font-size: 13px;
			line-height: 1.45;
			z-index: 16;
			box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
		}
		#install.show { display: flex; }
		#install .txt { flex: 1; }
		#install strong { display: block; font-size: 13px; }
		#install span { opacity: .85; font-size: 12px; }
		#install button {
			flex: none;
			width: 30px;
			height: 30px;
			border: 0;
			border-radius: 15px;
			background: rgba(255, 255, 255, .17);
			color: #fff;
			font-size: 19px;
			line-height: 1;
			cursor: pointer;
		}

		/* --- "Okreni telefon" (samo portret na telefonu) --- */
		#rotate {
			position: fixed;
			inset: 0;
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 20px;
			background: #87ceeb;
			font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
			color: #2c4a6e;
			text-align: center;
			padding: 24px;
			z-index: 15;
		}
		#rotate h2 { font-size: clamp(20px, 6vw, 30px); font-weight: 800; }
		#rotate p { font-size: clamp(13px, 3.6vw, 17px); opacity: .8; }

		/* Ikonica telefona koji se okrece */
		#rotate .phone {
			width: 62px;
			height: 106px;
			border: 4px solid #2c4a6e;
			border-radius: 11px;
			padding: 5px;
			animation: tilt 1.9s ease-in-out infinite;
		}
		#rotate .screen {
			width: 100%;
			height: 100%;
			background: rgba(44, 74, 110, .22);
			border-radius: 4px;
		}
		@keyframes tilt {
			0%, 42%   { transform: rotate(0deg); }
			58%, 100% { transform: rotate(-90deg); }
		}

		/* Kljuc: poruka samo kad je portret I ekran mali. Na desktopu u
		   uskom prozoru se ne pojavljuje (pointer: fine = mis). */
		@media (orientation: portrait) and (max-height: 900px) and (pointer: coarse) {
			#rotate { display: flex; }
		}

		/* --- "Zaglavilo se" (stari kes) --- */
		#stuck {
			position: fixed;
			left: 50%;
			bottom: 18px;
			transform: translateX(-50%);
			display: none;
			flex-direction: column;
			align-items: center;
			gap: 9px;
			padding: 13px 17px;
			border-radius: 13px;
			background: rgba(20, 40, 65, .92);
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
			font-size: 13px;
			text-align: center;
			z-index: 18;
		}
		#stuck.show { display: flex; }
		#stuck button {
			border: 0;
			border-radius: 9px;
			padding: 9px 20px;
			background: #ffd93d;
			color: #33291a;
			font-size: 14px;
			font-weight: 700;
			cursor: pointer;
		}

		/* --- Poruka o gresci --- */
		#err {
			position: fixed;
			inset: 0;
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 14px;
			padding: 24px;
			background: #2c3e50;
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
			text-align: center;
			z-index: 20;
		}
		#err.show { display: flex; }
		#err code {
			font-size: 12px;
			opacity: .8;
			max-width: 92vw;
			overflow-wrap: break-word;
		}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0">
		Tvoj browser ne podrzava HTML5 canvas.
	</canvas>

	<div id="boot">
		<h1>Evine Avanture</h1>
		<div id="bar"><div id="fill"></div></div>
		<p id="boot-msg">Ucitavanje...</p>
	</div>

	<div id="mapctl">
		<button id="mz-in"  aria-label="Zumiraj">+</button>
		<button id="mz-home" aria-label="Nazad na Evu">Eva</button>
		<button id="mz-out" aria-label="Odzumiraj">&#8722;</button>
	</div>

	<div id="install">
		<button id="install-x" aria-label="Zatvori">×</button>
		<div class="txt">
			<strong>Za igru bez trake browsera:</strong>
			<span id="install-how">Dodaj na pocetni ekran</span>
		</div>
	</div>

	<div id="rotate">
		<div class="phone">
			<div class="screen"></div>
		</div>
		<h2>Okreni telefon</h2>
		<p>Igra je lepsa kad je telefon polozen</p>
	</div>

	<div id="stuck">
		<p>Ucitavanje traje duze nego obicno.</p>
		<button id="stuck-btn">Osvezi igru</button>
	</div>

	<div id="err">
		<h2>Igra ne moze da se pokrene</h2>
		<code id="err-msg"></code>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
	(function () {
		const canvas = document.getElementById('canvas');
		const boot = document.getElementById('boot');
		const fill = document.getElementById('fill');
		const bootMsg = document.getElementById('boot-msg');

		function showError(text) {
			document.getElementById('err-msg').textContent = text;
			document.getElementById('err').classList.add('show');
			boot.classList.add('done');
		}

		const engine = new Engine($GODOT_CONFIG);

		engine.startGame({
			canvas: canvas,
			onProgress: function (current, total) {
				if (total > 0) {
					const pct = Math.min(100, (current / total) * 100);
					fill.style.width = pct + '%';
					bootMsg.textContent = 'Ucitavanje... ' + Math.floor(pct) + '%';
				} else {
					bootMsg.textContent = 'Ucitavanje...';
				}
			},
		}).then(function () {
			loaded = true;
			stuckBox.classList.remove('show');
			fill.style.width = '100%';
			boot.classList.add('done');
			setTimeout(() => boot.remove(), 500);
			// Fokus da tastatura radi odmah, bez klika.
			canvas.focus();
		}).catch(function (err) {
			showError(err && err.message ? err.message : String(err));
		});

		// Service worker - Chrome zahteva registrovan SW za "instaliraj" opciju.
		//
		// VAZNO: SW kesira index.html/js/wasm/pck. Bez logike ispod, nova
		// verzija igre se ne bi videla dok korisnik ne zatvori SVE tabove -
		// izgledalo bi kao da deploy nije prosao.
		//
		// NE koristimo reg.waiting.postMessage('update'). Godotov SW ima na
		// vrhu message handlera:
		//     if (event.origin !== self.origin) return;
		// Za postMessage sa stranice na SW je event.origin PRAZAN STRING, pa
		// taj uslov nikad nije zadovoljen i handler odmah izlazi. Poruka se
		// tiho ignorise, novi SW ostane zauvek "waiting", a stari nastavlja
		// da servira STARI index.pck iz kesa. Uninstall PWA ne pomaze - on
		// ne brise Cache Storage. Zato radimo sve sa strane stranice.
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('index.service.worker.js')
					.then(function (reg) {
						// Novi SW ceka? Pusti ga u promet bez postMessage:
						// unregister ubija starog, reload registruje novog
						// koji odmah preuzme kontrolu i obrise stare keseve
						// (njegov 'activate' brise sve sa starim CACHE_NAME).
						function takeOver() {
							if (!reg.waiting) return;
							if (sessionStorage.getItem('evaSwSwap')) return;  // samo jednom
							sessionStorage.setItem('evaSwSwap', '1');
							reg.unregister()
								.then(function () { window.location.reload(); })
								.catch(function () { window.location.reload(); });
						}

						reg.update().catch(function () {});
						takeOver();   // ako SW ceka od ranije

						reg.addEventListener('updatefound', function () {
							var sw = reg.installing;
							if (!sw) return;
							sw.addEventListener('statechange', function () {
								if (sw.state === 'installed') takeOver();
							});
						});

						// Dete drzi igru otvorenu dugo - proveravaj periodicno.
						setInterval(function () { reg.update().catch(function () {}); }, 60000);
					})
					.catch(function () { /* PWA nije kriticna - igra radi i bez nje */ });
			});

			// Drugi sloj zastite: uporedi verziju na mrezi sa onom koju je
			// SW posluzio. Ako se razlikuju, kes je zaglavljen - obrisi ga
			// i reloaduj. Ovo radi cak i kad SW nikad ne izadje iz "waiting".
			window.addEventListener('load', function () {
				setTimeout(function () {
					fetch('version.txt?cb=' + Date.now(), { cache: 'no-store' })
						.then(function (r) { return r.ok ? r.text() : null; })
						.then(async function (live) {
							if (!live) return;
							live = live.trim();
							var seen = localStorage.getItem('evaVersion');
							if (seen === live) return;               // vec na najnovijoj
							if (sessionStorage.getItem('evaPurge')) {  // vec probali
								localStorage.setItem('evaVersion', live);
								return;
							}
							sessionStorage.setItem('evaPurge', '1');
							localStorage.setItem('evaVersion', live);
							try {
								if (window.caches) {
									var keys = await caches.keys();
									await Promise.all(keys.map(function (k) { return caches.delete(k); }));
								}
								var regs = await navigator.serviceWorker.getRegistrations();
								await Promise.all(regs.map(function (r) { return r.unregister(); }));
							} catch (e) { /* probaj reload i bez ovoga */ }
							window.location.reload();
						})
						.catch(function () { /* offline - nista */ });
				}, 1200);
			});
		}

		// Ako se igra ne ucita na vreme, verovatno je zaglavljen stari kes.
		// Dugme brise kes + SW i reloaduje - resenje bez "obrisi podatke sajta".
		var loaded = false;
		var stuckBox = document.getElementById('stuck');
		setTimeout(function () {
			if (!loaded) stuckBox.classList.add('show');
		}, 25000);

		document.getElementById('stuck-btn').addEventListener('click', async function () {
			try {
				if (window.caches) {
					var keys = await caches.keys();
					await Promise.all(keys.map(function (k) { return caches.delete(k); }));
				}
				if (navigator.serviceWorker) {
					var regs = await navigator.serviceWorker.getRegistrations();
					await Promise.all(regs.map(function (r) { return r.unregister(); }));
				}
			} catch (e) { /* i bez ovoga probaj reload */ }
			window.location.reload();
		});

		// --- Kontrole mape ---
		//
		// SHELL definise API, NE igra. Ranije je shell cekao da Godot
		// registruje window.evaZoomIn - ako eval zakasni ili se scena
		// promeni, kontrole ostanu skrivene zauvek.
		//
		// Sada: shell upisuje komande u window.evaCmd od prvog frejma, a
		// igra ih samo cita (_poll_web_commands). window.evaMapActive
		// govori shell-u da li je mapa trenutno na ekranu.
		window.evaCmd = 0;
		window.evaPanX = 0;
		window.evaPanY = 0;
		window.evaMapActive = 0;
		window.evaZoomIn  = function () { window.evaCmd = 1; };
		window.evaZoomOut = function () { window.evaCmd = 2; };
		window.evaHome    = function () { window.evaCmd = 3; };
		window.evaPan = function (dx, dy) {
			window.evaPanX += dx;
			window.evaPanY += dy;
		};

		var mapctl = document.getElementById('mapctl');
		[['mz-in', window.evaZoomIn], ['mz-home', window.evaHome],
		 ['mz-out', window.evaZoomOut]].forEach(function (pair) {
			var el = document.getElementById(pair[0]);
			var fn = pair[1];
			['click', 'touchend'].forEach(function (t) {
				el.addEventListener(t, function (e) {
					e.preventDefault();
					e.stopPropagation();
					fn();
				}, { passive: false });
			});
		});

		// Prikazi kontrole samo dok je mapa aktivna (igra postavlja flag).
		setInterval(function () {
			mapctl.classList.toggle('show', window.evaMapActive === 1);
		}, 400);

		// Skrol misa/trackpada -> zum igre.
		canvas.addEventListener('wheel', function (e) {
			e.preventDefault();
			if (e.deltaY > 0) window.evaZoomOut();
			else window.evaZoomIn();
		}, { passive: false });

		// --- Pomeranje mape prevlacenjem (mis i prst) ---
		// Ide preko window.evaPan koji igra cita svaki frejm. Godotov
		// drag input na webu je nepouzdan, pa ovo radimo sami.
		var panning = false, panLast = null, panMoved = 0;

		function panStart(x, y) { panning = true; panLast = {x: x, y: y}; panMoved = 0; }
		function panMove(x, y) {
			if (!panning || !panLast) return;
			var dx = x - panLast.x, dy = y - panLast.y;
			panMoved += Math.abs(dx) + Math.abs(dy);
			panLast = {x: x, y: y};
			if (typeof window.evaPan === 'function') window.evaPan(dx, dy);
		}
		function panEnd() { panning = false; panLast = null; }

		canvas.addEventListener('pointerdown', function (e) {
			if (window.evaMapActive !== 1) return;   // pomeranje samo na mapi
			panStart(e.clientX, e.clientY);
		});
		canvas.addEventListener('pointermove', function (e) {
			if (!panning) return;
			panMove(e.clientX, e.clientY);
		});
		['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) {
			canvas.addEventListener(t, panEnd);
		});

		// Dva prsta = pinch zum.
		var pinchDist = 0;
		canvas.addEventListener('touchmove', function (e) {
			if (e.touches.length !== 2) return;
			e.preventDefault();
            panEnd();
			var dx = e.touches[0].clientX - e.touches[1].clientX;
			var dy = e.touches[0].clientY - e.touches[1].clientY;
			var d = Math.hypot(dx, dy);
			if (pinchDist > 0 && window.evaMapActive === 1) {
				var diff = d - pinchDist;
				if (Math.abs(diff) > 12) {
					if (diff > 0) window.evaZoomIn(); else window.evaZoomOut();
					pinchDist = d;
				}
			} else {
				pinchDist = d;
			}
		}, { passive: false });
		canvas.addEventListener('touchend', function () { pinchDist = 0; });

		// Blokiraj browserov skrol/pinch na canvasu - inace on preuzme
		// gest i Godot ga nikad ne vidi. passive:false je obavezno da
		// preventDefault() radi.
		['wheel', 'gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
			canvas.addEventListener(t, function (e) { e.preventDefault(); },
				{ passive: false });
		});
		// Dupli tap na iOS-u zumira stranicu - blokiraj i to.
		document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

		// --- Skrivanje browser trake ---
		//
		// Stranica NE MOZE sama da sakrije adresnu traku - to je bezbednosno
		// pravilo browsera. Dva nacina koja rade:
		//   1) Dodavanje na pocetni ekran (PWA manifest, display: fullscreen)
		//      -> igra se otvara kao aplikacija, bez ikakvog browser UI.
		//   2) Fullscreen API na dodir korisnika (radi na Androidu; iOS
		//      Safari ga ne podrzava za obican element).
		const standalone = window.matchMedia('(display-mode: fullscreen)').matches
			|| window.matchMedia('(display-mode: standalone)').matches
			|| window.navigator.standalone === true;

		const isTouch = window.matchMedia('(pointer: coarse)').matches;
		const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
			|| (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

		// Fullscreen na prvi dodir - jedini nacin koji browser dozvoljava.
		function tryFullscreen() {
			if (standalone || !isTouch) return;
			const el = document.documentElement;
			if (document.fullscreenElement) return;
			const fn = el.requestFullscreen || el.webkitRequestFullscreen;
			if (fn) {
				fn.call(el, { navigationUI: 'hide' }).catch(function () {});
			}
			// Zakljucaj na landscape ako browser podrzava.
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(function () {});
			}
		}
		document.addEventListener('pointerdown', tryFullscreen, { once: true });

		// Uputstvo za dodavanje na pocetni ekran (samo u browseru, na telefonu).
		if (isTouch && !standalone) {
			const box = document.getElementById('install');
			const how = document.getElementById('install-how');
			how.textContent = isIOS
				? 'Podeli (\u2191) \u2192 "Dodaj na po\u010Detni ekran"'
				: 'Meni (\u22EE) \u2192 "Dodaj na po\u010Detni ekran"';
			setTimeout(function () { box.classList.add('show'); }, 2600);
			document.getElementById('install-x').addEventListener('click', function () {
				box.classList.remove('show');
			});
		}

		// Klik/dodir uvek vraca fokus na igru.
		['pointerdown', 'touchstart'].forEach(function (ev) {
			document.addEventListener(ev, () => canvas.focus(), { passive: true });
		});
	})();
	</script>
</body>
</html>
