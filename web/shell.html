<!DOCTYPE html>
<html lang="sr">
<head>
	<meta charset="utf-8">
	<!-- viewport-fit=cover: canvas ide i pod "notch" na iPhone-u -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#87ceeb">
	<title>$GODOT_PROJECT_NAME</title>
	<link rel="icon" href="$GODOT_PROJECT_ICON">
	<link rel="apple-touch-icon" href="$GODOT_APPLE_TOUCH_ICON">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			/* Boja neba iz igre - ako se negde vidi ivica, stopi se sa igrom
			   umesto da bude crna pruga. */
			background: #87ceeb;
			touch-action: none;
			-webkit-tap-highlight-color: transparent;
			-webkit-user-select: none;
			user-select: none;
			overscroll-behavior: none;
		}

		/* Canvas popunjava CEO ekran - bez crnih pruga i bez okvira. */
		#canvas {
			display: block;
			border: 0;
			outline: none;
		}
		#canvas:focus { outline: none; }

		/* --- Ucitavanje --- */
		#boot {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 22px;
			background: #87ceeb;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
			color: #2c4a6e;
			z-index: 10;
			transition: opacity .4s ease;
		}
		#boot.done { opacity: 0; pointer-events: none; }

		#boot h1 {
			font-size: clamp(22px, 6vw, 40px);
			font-weight: 800;
			text-align: center;
			padding: 0 18px;
			text-shadow: 0 2px 0 rgba(255, 255, 255, .65);
		}

		#bar {
			width: min(74vw, 340px);
			height: 16px;
			border: 3px solid #fff;
			border-radius: 10px;
			overflow: hidden;
			background: rgba(255, 255, 255, .3);
		}
		#fill {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, #ffd93d, #ff9f43);
			transition: width .2s ease;
		}

		#boot p { font-size: clamp(13px, 3.4vw, 16px); opacity: .85; }

		/* --- "Okreni telefon" (samo portret na telefonu) --- */
		#rotate {
			position: fixed;
			inset: 0;
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 20px;
			background: #87ceeb;
			font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
			color: #2c4a6e;
			text-align: center;
			padding: 24px;
			z-index: 15;
		}
		#rotate h2 { font-size: clamp(20px, 6vw, 30px); font-weight: 800; }
		#rotate p { font-size: clamp(13px, 3.6vw, 17px); opacity: .8; }

		/* Ikonica telefona koji se okrece */
		#rotate .phone {
			width: 62px;
			height: 106px;
			border: 4px solid #2c4a6e;
			border-radius: 11px;
			padding: 5px;
			animation: tilt 1.9s ease-in-out infinite;
		}
		#rotate .screen {
			width: 100%;
			height: 100%;
			background: rgba(44, 74, 110, .22);
			border-radius: 4px;
		}
		@keyframes tilt {
			0%, 42%   { transform: rotate(0deg); }
			58%, 100% { transform: rotate(-90deg); }
		}

		/* Kljuc: poruka samo kad je portret I ekran mali. Na desktopu u
		   uskom prozoru se ne pojavljuje (pointer: fine = mis). */
		@media (orientation: portrait) and (max-height: 900px) and (pointer: coarse) {
			#rotate { display: flex; }
		}

		/* --- Poruka o gresci --- */
		#err {
			position: fixed;
			inset: 0;
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 14px;
			padding: 24px;
			background: #2c3e50;
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
			text-align: center;
			z-index: 20;
		}
		#err.show { display: flex; }
		#err code {
			font-size: 12px;
			opacity: .8;
			max-width: 92vw;
			overflow-wrap: break-word;
		}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0">
		Tvoj browser ne podrzava HTML5 canvas.
	</canvas>

	<div id="boot">
		<h1>Adventure of Amazing Eva</h1>
		<div id="bar"><div id="fill"></div></div>
		<p id="boot-msg">Ucitavanje...</p>
	</div>

	<div id="rotate">
		<div class="phone">
			<div class="screen"></div>
		</div>
		<h2>Okreni telefon</h2>
		<p>Igra je lepsa kad je telefon polozen</p>
	</div>

	<div id="err">
		<h2>Igra ne moze da se pokrene</h2>
		<code id="err-msg"></code>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
	(function () {
		const canvas = document.getElementById('canvas');
		const boot = document.getElementById('boot');
		const fill = document.getElementById('fill');
		const bootMsg = document.getElementById('boot-msg');

		function showError(text) {
			document.getElementById('err-msg').textContent = text;
			document.getElementById('err').classList.add('show');
			boot.classList.add('done');
		}

		const engine = new Engine($GODOT_CONFIG);

		engine.startGame({
			canvas: canvas,
			onProgress: function (current, total) {
				if (total > 0) {
					const pct = Math.min(100, (current / total) * 100);
					fill.style.width = pct + '%';
					bootMsg.textContent = 'Ucitavanje... ' + Math.floor(pct) + '%';
				} else {
					bootMsg.textContent = 'Ucitavanje...';
				}
			},
		}).then(function () {
			fill.style.width = '100%';
			boot.classList.add('done');
			setTimeout(() => boot.remove(), 500);
			// Fokus da tastatura radi odmah, bez klika.
			canvas.focus();
		}).catch(function (err) {
			showError(err && err.message ? err.message : String(err));
		});

		// Klik/dodir uvek vraca fokus na igru.
		['pointerdown', 'touchstart'].forEach(function (ev) {
			document.addEventListener(ev, () => canvas.focus(), { passive: true });
		});
	})();
	</script>
</body>
</html>
